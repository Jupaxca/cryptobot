name: Super Bot Cripto 24/7 (Core-Satellite)

on:
  schedule:
    - cron: '5 3,7,11,15,19,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout al repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests scikit-learn xgboost

      - name: Ejecutar el Super Bot 24/7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_dca.py

      - name: Persistir estado (Evitar Spam en Telegram)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bot_estado.json
          git commit -m "update: persistencia automatica del estado del bot" || echo "Sin cambios de estado"
          git push
