name: Super Bot Cripto 24/7 (Core-Satellite)

on:
  schedule:
    - cron: '5 0,4,8,12,16,20 * * *' # Ejecuta 5 minutos después del cierre (ej: 00:05, 04:05 UTC) para evitar retrasos de GitHub y asegurar la vela
  workflow_dispatch: # Permite ejecutarlo manualmente desde la web cuando quieras

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout al repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy requests scikit-learn xgboost

      - name: Ejecutar el Super Bot 24/7
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_dca.py

      - name: Persistir estado y Memoria IA (Evitar amnesia del modelo)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bot_estado.json || echo "bot_estado.json no encontrado"
          git add memoria_predicciones.csv || echo "memoria_predicciones.csv no creado aún"
          git commit -m "update: persistencia automatica del estado y memoria IA del bot" || echo "Sin cambios de estado"
          git push
